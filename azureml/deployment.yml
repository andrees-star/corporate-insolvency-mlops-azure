$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json

name: blue 
endpoint_name: insolvency-risk24-endpoint

model: azureml:insolvency-logistic-risk24:1
environment: azureml:mlops-insolvency-env:1

code_configuration:
  code: ../src
  scoring_script: score.py

instance_type: Standard_DS1_v2
instance_count: 1

request_settings:
  request_timeout_ms: 5000

liveness_probe:
  initial_delay: 30
  period: 10
  timeout: 2
  failure_threshold: 30

readiness_probe:
  initial_delay: 30
  period: 10
  timeout: 2
  failure_threshold: 30